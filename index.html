<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>دفتر الصلات</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الصلات">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F3F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
/* Layout: native iOS shell — translucent top bar + large title, inset grouped lists, bottom tab bar, bottom sheets. RTL. */
:root{
  --bg:#F2F3F7; --card:#FFFFFF; --fill:#E9EBF0; --ink:#111418; --muted:#6B7280; --sep:#D9DCE3;
  --accent:#0A7A73; --accent-ink:#FFFFFF; --accent-soft:#DDF1EE;
  --gold:#A86A00; --gold-soft:#FAEBCB; --red:#D1352B; --red-soft:#FBE1DE; --green:#248A4F; --green-soft:#DDF2E5;
  --bar:rgba(247,248,251,.84); --shadow:0 1px 2px rgba(16,24,40,.06);
  --font:-apple-system,"SF Arabic","SF Pro Text","Geeza Pro","Segoe UI",Tahoma,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --ink:#F2F3F5; --muted:#9A9FA8; --sep:#38383A;
  --accent:#3CC2B6; --accent-ink:#00211E; --accent-soft:#0E302C;
  --gold:#F0B44A; --gold-soft:#3A2B0F; --red:#FF6B60; --red-soft:#3B1715; --green:#4CD483; --green-soft:#12301F;
  --bar:rgba(18,18,20,.82); --shadow:none; color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);margin:0}
body{padding-top:env(safe-area-inset-top,0px);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
img{max-width:100%}
[hidden]{display:none!important}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.page{max-width:720px;margin:0 auto}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-bottom:.5px solid transparent;transition:border-color .2s}
.topbar.scrolled{border-bottom-color:var(--sep)}
.topbar .in{display:flex;align-items:center;gap:8px;height:46px}
.topbar .mini{font-weight:600;font-size:17px;opacity:0;transition:opacity .2s;flex:1;text-align:center}
.topbar.scrolled .mini{opacity:1}
.store{font-size:11px;color:var(--muted);display:inline-flex;align-items:center;gap:5px;white-space:nowrap;min-width:80px}
.store i{width:7px;height:7px;border-radius:50%;background:var(--green)}
.store.off i{background:var(--gold)}
.iconbtn{appearance:none;border:0;background:none;color:var(--accent);font:inherit;font-size:16px;padding:6px;min-width:40px;min-height:40px;display:inline-grid;place-items:center;cursor:pointer;border-radius:10px}
.iconbtn svg{width:24px;height:24px}
.topbar .iconbtn{min-width:80px;justify-items:end}
.largetitle{display:flex;align-items:flex-end;gap:10px;padding-block:2px 10px}
.largetitle h1{font-size:34px;line-height:1.15;font-weight:700;margin:0;letter-spacing:-.01em;flex:1;min-width:0;text-wrap:balance}
.lt-sub{color:var(--muted);font-size:15px;margin:-6px 0 8px}
main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main.chatmode{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:22px;padding-block:4px 20px}
.gtitle{font-size:13px;font-weight:400;color:var(--muted);margin:0 0 6px;padding-inline:16px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.gtitle .link{font-size:13px}
.group{background:var(--card);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.cell{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:52px;position:relative;cursor:pointer;width:100%;text-align:start;font:inherit;color:inherit;background:none;border:0;text-decoration:none}
.cell+.cell::before{content:"";position:absolute;top:0;inset-inline-end:0;inset-inline-start:68px;border-top:.5px solid var(--sep)}
.cell.plain+.cell::before,.cell+.cell.plain::before{inset-inline-start:16px}
.cell:active{background:var(--fill)}
.cell .body{flex:1;min-width:0}
.cell .t{font-weight:600;font-size:16px;overflow-wrap:anywhere;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.cell .s{font-size:14px;color:var(--muted);overflow-wrap:anywhere}
.cell .chev{color:var(--muted);opacity:.5;flex:none;width:8px;height:13px}
.avatar{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;background:linear-gradient(160deg,var(--av1,#5B8DEF),var(--av2,#3B63C4))}
.avatar.org{border-radius:11px}
.avatar.lg{width:78px;height:78px;font-size:32px}
.avatar.lg.org{border-radius:20px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;padding:2px 8px;border-radius:99px;background:var(--fill);color:var(--muted);white-space:nowrap}
.chip.late{background:var(--red-soft);color:var(--red)} .chip.soon{background:var(--gold-soft);color:var(--gold)} .chip.ok{background:var(--green-soft);color:var(--green)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.num{font-variant-numeric:tabular-nums}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:15px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);border:0;font:inherit;color:inherit;text-align:start;cursor:pointer}
.tile .v{font-size:30px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
.tile.red .v{color:var(--red)} .tile.gold .v{color:var(--gold)} .tile.acc .v{color:var(--accent)}
.ask{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:var(--r);padding:12px 14px;box-shadow:var(--shadow);cursor:pointer;border:0;width:100%;font:inherit;color:var(--muted);text-align:start}
.ask .spark{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.ask b{color:var(--ink);font-weight:600;display:block}
.banner{background:var(--gold-soft);border-radius:var(--r);padding:12px 14px;font-size:14px;line-height:1.6}
.banner b{color:var(--gold)}
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:11px;padding:0 10px;height:38px}
.search svg{width:16px;height:16px;color:var(--muted);flex:none}
.search input{border:0;background:none;outline:none;font:inherit;font-size:16px;color:var(--ink);flex:1;min-width:0;height:100%}
.seg{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.seg::-webkit-scrollbar{display:none}
.pill{appearance:none;border:0;font:inherit;font-size:14px;font-weight:500;background:var(--card);color:var(--ink);padding:6px 13px;border-radius:99px;cursor:pointer;white-space:nowrap;box-shadow:var(--shadow)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.pill .n{opacity:.6;margin-inline-start:5px;font-variant-numeric:tabular-nums}
.btn{appearance:none;font:inherit;font-size:16px;font-weight:600;border:0;background:var(--card);color:var(--accent);padding:11px 16px;border-radius:12px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;min-height:46px;box-shadow:var(--shadow)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.sm{font-size:14px;padding:6px 12px;min-height:34px;border-radius:9px;background:var(--fill);box-shadow:none}
.btn.red{color:var(--red)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.link{appearance:none;border:0;background:none;color:var(--accent);font:inherit;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.field{display:flex;align-items:center;gap:10px;padding:10px 16px;min-height:48px;position:relative}
.field+.field::before{content:"";position:absolute;top:0;inset-inline-end:0;inset-inline-start:16px;border-top:.5px solid var(--sep)}
.field>label{flex:none;width:92px;font-size:15px;color:var(--ink)}
.field input,.field select,.field textarea{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:16px;color:var(--ink);outline:none;padding:0}
.field textarea{resize:vertical;min-height:70px;line-height:1.6}
.field.col{flex-direction:column;align-items:stretch;gap:4px}
.field.col>label{width:auto;color:var(--muted);font-size:13px}
.ltr{direction:ltr;text-align:right}
.hint{font-size:13px;color:var(--muted);margin:6px 16px 0;line-height:1.6}
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:720px;max-height:94dvh;border-radius:16px 16px 0 0;background:var(--bg);color:var(--ink)}
dialog.sheet[open]{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
dialog.sheet::backdrop{background:rgba(0,0,0,.4)}
.sh{display:flex;flex-direction:column;max-height:94dvh}
.sh-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding-block:8px 6px;position:relative}
.sh-h::before{content:"";position:absolute;top:6px;left:50%;transform:translateX(-50%);width:36px;height:5px;border-radius:3px;background:var(--sep)}
.sh-h h2{font-size:17px;font-weight:600;margin:12px 0 0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}
.sh-h .a{margin-top:12px}
.sh-h .a.end{justify-self:end}
.sh-b>*{flex-shrink:0}
.sh-b{overflow-y:auto;padding-block:8px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px;-webkit-overflow-scrolling:touch}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding-top:6px}
.hero h3{font-size:24px;margin:4px 0 0;font-weight:700;text-wrap:balance}
.hero p{margin:0;color:var(--muted)}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.act{appearance:none;border:0;background:var(--card);border-radius:12px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--accent);font:inherit;font-size:12px;cursor:pointer;text-decoration:none;box-shadow:var(--shadow)}
.act svg{width:22px;height:22px}
.act.off{opacity:.4;pointer-events:none}
.log .e{padding:10px 16px;font-size:14px;position:relative}
.log .e::before{content:"";position:absolute;top:0;inset-inline:16px 0;border-top:.5px solid var(--sep)}
.log .d{color:var(--muted);font-size:12px}
.preview{background:var(--card);border-radius:var(--r);padding:14px 16px;white-space:pre-wrap;font-size:15px;overflow-wrap:anywhere;max-height:260px;overflow-y:auto;box-shadow:var(--shadow)}
.preview .subj{font-weight:700;display:block;margin-bottom:8px}
.tabbar{position:fixed;inset:auto 0 0 0;z-index:25;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(18px);backdrop-filter:saturate(180%) blur(18px);border-top:.5px solid var(--sep);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabbar .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:720px;margin:0 auto;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tb{appearance:none;border:0;background:none;font:inherit;font-size:10.5px;font-weight:500;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;cursor:pointer;position:relative}
.tb svg{width:26px;height:26px}
.tb[aria-selected="true"]{color:var(--accent)}
.tb .badge{position:absolute;top:3px;left:calc(50% - 22px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px;font-variant-numeric:tabular-nums}
.msgs{display:flex;flex-direction:column;gap:10px;padding-block:6px 10px}
.msg{max-width:86%;padding:9px 13px;border-radius:18px;font-size:16px;line-height:1.55;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-end-end-radius:6px}
.msg.a{align-self:flex-start;background:var(--card);border-end-start-radius:6px;box-shadow:var(--shadow)}
.msg.a a{color:var(--accent)}
.msg.thinking{color:var(--muted)}
.msg .dots{display:inline-flex;gap:3px;margin-inline-start:6px;vertical-align:middle}
.msg .dots i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite}
.msg .dots i:nth-child(2){animation-delay:.2s}.msg .dots i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.attach{align-self:flex-start;display:flex;flex-direction:column;gap:6px;max-width:92%;width:100%}
.suggest{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:4px}
.suggest::-webkit-scrollbar{display:none}
.sugg{appearance:none;border:0;background:var(--card);border-radius:14px;padding:10px 12px;font:inherit;font-size:14px;color:var(--ink);text-align:start;cursor:pointer;min-width:170px;max-width:220px;box-shadow:var(--shadow);white-space:normal;flex:none}
.sugg b{display:block;font-size:14px;margin-bottom:2px}
.sugg span{color:var(--muted);font-size:13px}
.composer{position:fixed;inset-inline:0;bottom:calc(57px + env(safe-area-inset-bottom,0px));z-index:24;background:var(--bar);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-top:.5px solid var(--sep)}
.composer .in{display:flex;align-items:flex-end;gap:6px;padding-block:8px}
.composer textarea{flex:1;min-width:0;border:.5px solid var(--sep);background:var(--card);border-radius:20px;padding:8px 14px;font:inherit;font-size:16px;color:var(--ink);resize:none;max-height:140px;line-height:1.45;outline:none}
.send{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;cursor:pointer;margin-bottom:2px}
.send[disabled]{opacity:.35}
.send svg,.clip svg{width:20px;height:20px}
.clip{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:none;color:var(--accent);display:grid;place-items:center;cursor:pointer;margin-bottom:2px}
.thumbs{display:flex;gap:6px;padding-top:8px}
.thumbs img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.toast{position:fixed;top:calc(56px + env(safe-area-inset-top,0px));left:50%;transform:translate(-50%,-10px);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:99px;font-size:14px;font-weight:500;z-index:60;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="topbar" id="topbar"><div class="page pad in">
  <span class="store" id="store"><i></i><span>على جهازك</span></span>
  <span class="mini" id="mini"></span>
  <button class="iconbtn" id="topAct" aria-label="إضافة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div></header>
<main id="main"><div class="page pad" id="view"></div></main>
<div class="composer" id="composer" hidden><div class="page pad">
  <div class="thumbs" id="thumbs" hidden></div>
  <div class="in">
    <button class="clip" id="clipBtn" aria-label="إرفاق صورة"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="14" rx="3"/><circle cx="12" cy="13" r="3.2"/><path d="M8.5 6l1.5-2h4l1.5 2"/></svg></button>
    <input type="file" id="photo" accept="image/*" hidden multiple>
    <textarea id="chatIn" rows="1" placeholder="اسأل، أو اطلب بحثًا، أو الصق نصًا…"></textarea>
    <button class="send" id="sendBtn" aria-label="إرسال" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"/></svg></button>
  </div></div></div>
<nav class="tabbar"><div class="in" role="tablist">
  <button class="tb" data-tab="today" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg>اليوم<span class="badge" id="bToday" hidden></span></button>
  <button class="tb" data-tab="contacts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20c.8-3.8 4-5.8 7.5-5.8s6.7 2 7.5 5.8"/></svg>الصلات</button>
  <button class="tb" data-tab="ai"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg>المساعد</button>
  <button class="tb" data-tab="opps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="3"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 12.5h18"/></svg>الفرص</button>
  <button class="tb" data-tab="more"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="18.5" cy="12" r="1.9"/></svg>المزيد</button>
</div></nav>
<dialog class="sheet" id="sheet"><div class="sh" id="shIn"></div></dialog>
<div class="toast" id="toast"></div>

<script>
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const addDays=(iso,n)=>{const d=new Date(iso+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const diff=(a,b)=>Math.round((new Date(b+'T12:00:00Z')-new Date(a+'T12:00:00Z'))/864e5);
const fmt=iso=>{if(!iso)return '—';try{return new Intl.DateTimeFormat('ar-u-nu-latn',{day:'numeric',month:'short',year:'numeric'}).format(new Date(iso+'T12:00:00'))}catch{return iso}};
const newId=p=>p+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm=s=>String(s||'').toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
let T=todayISO();
const isoDate=s=>/^\d{4}-\d{2}-\d{2}$/.test(String(s||''))?s:'';
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2400)}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('نُسخ')}catch{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('نُسخ')}catch{toast('تعذّر النسخ')}ta.remove()}}

const S={items:new Map(),loaded:false,tab:'today',q:'',cat:'all',stage:'open',busy:false,status:''};
const IDB={db:null,
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('silat',1);r.onupgradeneeded=()=>r.result.createObjectStore('items',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res()};r.onerror=()=>rej(r.error)})},
  tx(mode){return this.db.transaction('items',mode).objectStore('items')},
  all(){return new Promise((res,rej)=>{const r=this.tx('readonly').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  put(x){return new Promise((res,rej)=>{const r=this.tx('readwrite').put(x);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})},
  del(id){return new Promise((res,rej)=>{const r=this.tx('readwrite').delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)})}};
let useLS=false;
async function initStore(){
  try{await IDB.open();const a=await IDB.all();S.items=new Map(a.map(x=>[x.id,x]))}
  catch{useLS=true;try{const a=JSON.parse(localStorage.getItem('silat.v1')||'[]');S.items=new Map(a.map(x=>[x.id,x]))}catch{}}
  S.loaded=true;
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch{}
  render();
}
async function put(item,quiet){
  const clean=JSON.parse(JSON.stringify(item));delete clean.ex;S.items.set(clean.id,clean);
  try{if(useLS)localStorage.setItem('silat.v1',JSON.stringify([...S.items.values()]));else await IDB.put(clean)}catch{toast('تعذّر الحفظ على الجهاز')}
  if(!quiet)render();
}
async function del(id){S.items.delete(id);try{if(useLS)localStorage.setItem('silat.v1',JSON.stringify([...S.items.values()]));else await IDB.del(id)}catch{}render()}

/* ================= small renderers ================= */
function dueChip(iso,label){if(!iso)return '';const d=diff(T,iso);
  if(d<0)return `<span class="chip late">${label} متأخرة <span class="num">${-d}</span> ي</span>`;
  if(d===0)return `<span class="chip late">${label} اليوم</span>`;
  if(d<=7)return `<span class="chip soon">${label} بعد <span class="num">${d}</span> ي</span>`;
  return `<span class="chip">${label} ${fmt(iso)}</span>`}
function lastTxt(c){if(!c.last)return 'لم تتواصل بعد';const d=diff(c.last,T);return d===0?'تواصلت اليوم':`آخر تواصل قبل ${d} يوم`}
function avatar(c,lg){const n=displayName(c);return `<div class="avatar ${c.type==='org'?'org':''} ${lg?'lg':''}" style="${avStyle(n)}">${esc(initial(n))}</div>`}

async function shareFile(name,text,mime){
  const blob=new Blob([text],{type:mime});
  try{const f=new File([blob],name,{type:mime});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}
const vEsc=s=>String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/([,;])/g,'\\$1');
function vcard(c){const L=['BEGIN:VCARD','VERSION:3.0'];
  if(c.type==='org'){L.push('FN:'+vEsc(c.org||c.name),'ORG:'+vEsc(c.org)+(c.name?';'+vEsc(c.name):''),'X-ABShowAs:COMPANY')}
  else{const parts=(c.name||'').trim().split(/\s+/);L.push('FN:'+vEsc(c.name),'N:'+vEsc(parts.slice(1).join(' '))+';'+vEsc(parts[0]||'')+';;;');if(c.org)L.push('ORG:'+vEsc(c.org));if(c.role)L.push('TITLE:'+vEsc(c.role))}
  if(c.email)L.push('EMAIL;TYPE=INTERNET:'+c.email);if(c.phone)L.push('TEL;TYPE=CELL:'+c.phone);
  (c.links||'').split(/\s+/).filter(Boolean).forEach(u=>L.push('URL:'+(/^https?:/.test(u)?u:'https://'+u)));
  if(c.notes)L.push('NOTE:'+vEsc(c.notes));L.push('END:VCARD');return L.join('\r\n')}
function ics(title,date,notes){const d=date.replace(/-/g,''),e=addDays(date,1).replace(/-/g,'');const st=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Silat//AR','BEGIN:VEVENT','UID:'+newId('e')+'@silat','DTSTAMP:'+st,'DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+e,'SUMMARY:'+vEsc(title),'DESCRIPTION:'+vEsc(notes||''),'BEGIN:VALARM','TRIGGER:PT9H','ACTION:DISPLAY','DESCRIPTION:'+vEsc(title),'END:VALARM','END:VEVENT','END:VCALENDAR'].join('\r\n')}

- أجب بالعربية الواضحة وباختصار، إلا إن كتب بالإنجليزية. نص عادي دون عناوين Markdown؛ يمكن ** لتشديد قليل وشرطات للقوائم. لا تضع روابط في النص، فالمصادر تُعرض تلقائيًا تحت ردك.
- لديك أداة web_search للبحث الفعلي في الويب. استعملها حين يطلب فرصًا أو جهات أو معلومات حديثة. فضّل المواقع الرسمية للجهات وصفحات الإعلانات الأصلية على المجمّعات.
- الأرشفة: احفظ بأداة save_items، دفعة واحدة، كل فرصة حقيقية مفتوحة وجدتها (العنوان، الجهة، الموعد بصيغة YYYY-MM-DD، رابط الإعلان، بريد التقديم إن ظهر، عن بُعد أم لا، والمصدر)، والجهة الموظِّفة أو المانحة كجهة (kind=contact, type=org) مع إيميلها وهاتفها إن ظهرا في المصدر، وأي بوابة توظيف أو دليل مفيد كمصدر (kind=source).
- الدقة أهم من الكثرة: لا تخترع إيميلات أو أرقامًا أو روابط أو مواعيد. احفظ فقط ما رأيته فعلًا في نتائج البحث أو في نص المستخدم أو صورته. إن لم يظهر بريد فاتركه فارغًا. تجاهل الفرص المنتهية، والمريبة (رسوم مقابل التوظيف، وعود غير واقعية) ونبّه عليها.
- قبل الحفظ، تحقق بـsearch_notebook مما إذا كانت الفرصة أو الجهة موجودة لتجنب التكرار (الأداة تدمج المتطابق تلقائيًا أيضًا).
- حين يلصق نصًا أو صورة (إعلان، بطاقة عمل، صفحة اتصال): استخرج كل الجهات والأشخاص والإيميلات والأرقام والمواعيد واحفظها.
- لأسئلة الدفتر استعمل search_notebook ولا تخمّن. العناصر التي عليها example=true أمثلة توضيحية وليست حقيقية.
- لكتابة رسالة استعمل draft_email واملأ الاسم والجهة فعليًا.
- لتحديث متابعة أو مرحلة أو تسجيل ملاحظة استعمل update_item.
- بعد الانتهاء لخّص في أسطر قليلة: ماذا وجدت، ماذا حفظت، وما الذي يستحق أن يبدأ به اليوم ولماذا.
- القيم: cat من ${CATS.map(c=>c[0]+'='+c[1]).join('، ')}. stage من ${STAGES.map(c=>c[0]+'='+c[1]).join('، ')}. otype من ${OTYPES.map(c=>c[0]+'='+c[1]).join('، ')}.`}

async function runTool(name,a){
  if(name==='search_notebook'){const toks=norm(a.query).split(/\s+/).filter(t=>t.length>1);
   let pool=[...contacts(),...opps(),...sources()];if(a.kind&&a.kind!=='any')pool=pool.filter(x=>x.kind===a.kind);
   const scored=pool.map(x=>{const h=norm(JSON.stringify(compact(x)));const sc=toks.length?toks.filter(t=>h.includes(t)).length:1;return [sc,x]}).filter(([s])=>s>0).sort((p,q)=>q[0]-p[0]||(q[1].added||'').localeCompare(p[1].added||''));
   return {results:scored.slice(0,12).map(([,x])=>compact(x)),total:scored.length}}
  if(name==='save_items'){const out=[];const list=(a.items||[]).slice(0,40);
   for(const it of list.filter(i=>i.kind!=='opp')){const r=await upsertFromAI(it);if(r)out.push(r)}
   for(const it of list.filter(i=>i.kind==='opp')){const r=await upsertFromAI(it);if(r)out.push(r)}
   curMsg.saved=(curMsg.saved||[]).concat(out);return {saved:out.map(r=>({id:r.id,action:r.action,label:r.label}))}}
  if(name==='update_item'){const x=S.items.get(a.id);if(!x)return {error:'لا يوجد عنصر حقيقي بهذا الـid'};const y={...x};
   if(a.next!==undefined)y.next=isoDate(a.next);if(a.last)y.last=isoDate(a.last)||y.last;if(a.stage&&STAGE[a.stage])y.stage=a.stage;if(a.deadline)y.deadline=isoDate(a.deadline)||y.deadline;
   if(a.rel>=1&&a.rel<=3)y.rel=a.rel;if(a.notes_append)y.notes=((y.notes||'')+'\n'+a.notes_append).trim();if(a.log_note)y.log=[...(y.log||[]),{d:T,t:'note',s:a.log_note}].slice(-200);
   await put(y,true);curMsg.saved=(curMsg.saved||[]).concat([{id:y.id,action:'updated'}]);return {ok:true}}
  if(name==='draft_email'){curMsg.draft={contact_id:a.contact_id||'',to:a.to_email||'',subject:a.subject||'',body:a.body||'',opp_id:a.opp_id||''};return {shown:true}}
  return {error:'أداة غير معروفة'}
}
function findExisting(it){
  const em=(it.email||'').toLowerCase().trim();
  if(it.kind==='contact')return all('contact').find(c=>(em&&(c.email||'').toLowerCase()===em)||(it.name&&norm(c.name)===norm(it.name)&&norm(c.org)===norm(it.org||c.org))||(!it.name&&it.org&&c.type==='org'&&norm(c.org)===norm(it.org)));
  if(it.kind==='opp')return all('opp').find(o=>(it.link&&o.link===it.link)||(norm(o.title)===norm(it.title)&&norm(o.org)===norm(it.org||o.org)));
  if(it.kind==='source')return all('source').find(s=>(it.url&&s.url===it.url)||(it.title&&norm(s.title)===norm(it.title)));
}
async function upsertFromAI(it){
  if(!it||!['contact','opp','source'].includes(it.kind))return null;
  const ex=findExisting(it);const base=ex?{...ex}:{id:newId(it.kind==='contact'?'c':it.kind==='opp'?'o':'s'),kind:it.kind,added:T,src:'ai',seen:false};
  const set=(k,v)=>{if(v!==undefined&&v!==null&&String(v).trim()!=='')base[k]=typeof v==='string'?v.trim():v};
  if(it.kind==='contact'){if(!base.log)base.log=[];set('type',it.type||base.type||(it.name?'person':'org'));['name','org','role','email','phone','country','tags','links','source'].forEach(k=>set(k,it[k]));base.cat=CAT[it.cat]?it.cat:(base.cat||'other');if(!base.rel)base.rel=2;
    if(it.notes)base.notes=base.notes&&!base.notes.includes(it.notes)?base.notes+'\n'+it.notes:it.notes;
    if(!base.name&&!base.org&&!base.email)return null}
  if(it.kind==='opp'){['title','org','location','link','email','source'].forEach(k=>set(k,it[k]));base.otype=OTYPE[it.otype]?it.otype:(base.otype||'job');base.stage=STAGE[it.stage]?it.stage:(base.stage||'idea');
    if(isoDate(it.deadline))base.deadline=it.deadline;if(typeof it.remote==='boolean')base.remote=it.remote;if(it.notes)base.notes=it.notes;
    if(it.contact_ref){const r=norm(it.contact_ref);const c=all('contact').find(c=>c.id===it.contact_ref||norm(c.email)===r||norm(displayName(c))===r||norm(c.org)===r);if(c)base.contactId=c.id}
    else if(!base.contactId&&base.org){const c=all('contact').find(c=>norm(c.org)===norm(base.org));if(c)base.contactId=c.id}
    if(!base.title)return null}
  if(it.kind==='source'){set('title',it.title||it.name);set('url',it.url||it.link);base.cat=CAT[it.cat]?it.cat:(base.cat||'other');if(it.notes)base.notes=it.notes;if(base.url&&!/^https?:/.test(base.url))base.url='https://'+base.url;if(!base.title&&!base.url)return null}
  await put(base,true);
  return {id:base.id,action:ex?'updated':'added',label:base.kind==='contact'?displayName(base):base.title}
}
async function callClaude(body){
  const {key}=aiConf();
  const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify(body)});
  let j=null;try{j=await r.json()}catch{}
  if(!r.ok){const m=j&&j.error&&j.error.message||('HTTP '+r.status);const err=new Error(m);err.status=r.status;throw err}
  return j;
}
function apiErrorText(e){
  if(!navigator.onLine)return 'لا يوجد اتصال بالإنترنت. المساعد يحتاج الاتصال؛ باقي الدفتر يعمل دونه.';
  if(e.status===401)return 'المفتاح غير صحيح أو أُلغي. راجعه من المزيد ← المساعد الذكي.';
  if(e.status===400&&/credit|balance/i.test(e.message))return 'رصيد حسابك في Anthropic نفد. أضف رصيدًا من console.anthropic.com.';
  if(e.status===429)return 'طلبات كثيرة في وقت قصير. انتظر دقيقة وأعد المحاولة.';
  if(e.status===529||e.status>=500)return 'خدمة Anthropic مشغولة الآن. أعد المحاولة بعد قليل.';
  if(e.status===404&&/model/i.test(e.message))return 'النموذج المختار غير متاح لحسابك. اختر نموذجًا آخر من إعداد المساعد.';
  return 'تعذّر الحصول على رد: '+e.message;
}

async function sendChat(text,opts={}){
  text=(text??$('#chatIn').value).trim();if((!text&&!pendingImgs.length)||S.busy)return;
  const conf=aiConf();if(!conf.key){S.tab='ai';render();editAI();return}

  const imgs=pendingImgs;pendingImgs=[];$('#thumbs').hidden=true;$('#thumbs').innerHTML='';
  const shown=opts.label||text||'استخرج المعلومات من الصورة واحفظها';
  msgs.push({r:'u',t:shown,imgs:imgs.length||undefined});
  curMsg={r:'a',t:'',thinking:true,status:'يفكر'};msgs.push(curMsg);
  S.items.set('chat',{...doc,msgs});$('#chatIn').value='';autoGrow();S.busy=true;S.tab='ai';render();scrollChatEnd();
  // history: compact text of previous turns
  const hist=[];for(const m of msgs.slice(-17,-2)){const c=(m.t||'…')+(m.saved&&m.saved.length?`\n[حُفظ أو حُدّث ${m.saved.length} عنصر]`:'')+(m.draft?'\n[جُهّزت مسودة رسالة]':'');const role=m.r==='u'?'user':'assistant';if(hist.length&&hist[hist.length-1].role===role)hist[hist.length-1].content+='\n\n'+c;else hist.push({role,content:c})}
  if(hist.length&&hist[0].role==='assistant')hist.shift();
  const userContent=[];for(const b of imgs){userContent.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:b}})}
  userContent.push({type:'text',text:text||'استخرج كل المعلومات المفيدة من الصورة واحفظها في الدفتر.'});
  if(hist.length&&hist[hist.length-1].role==='user')hist.push({role:'assistant',content:'حسنًا.'});
  const messages=[...hist,{role:'user',content:userContent}];
  const cites=new Map();let usageIn=0,usageOut=0,searches=0,finalText='';
  try{
    for(let step=0;step<12;step++){
      const res=await callClaude({model:conf.model,max_tokens:4096,system:systemPrompt(),tools:TOOLS,messages});
      messages.push({role:'assistant',content:res.content});
      if(res.usage){usageIn+=res.usage.input_tokens||0;usageOut+=res.usage.output_tokens||0;searches+=(res.usage.server_tool_use&&res.usage.server_tool_use.web_search_requests)||0}
      const texts=[];

        if(b.type==='text'){texts.push(b.text);(b.citations||[]).forEach(c=>{if(c.url&&!cites.has(c.url))cites.set(c.url,{url:c.url,title:c.title})})}
        if(b.type==='server_tool_use'&&b.input&&b.input.query)setStatus('يبحث في الويب: «'+b.input.query+'»');

          setStatus(b.name==='save_items'?'يؤرشف في الدفتر':b.name==='search_notebook'?'يبحث في دفترك':b.name==='draft_email'?'يكتب الرسالة':'يحدّث الدفتر');
          let out;try{out=await runTool(b.name,b.input||{})}catch(err){out={error:String(err&&err.message||err)}}
          results.push({type:'tool_result',tool_use_id:b.id,content:JSON.stringify(out)});
        }
        messages.push({role:'user',content:results});render();setStatus('يكمل');continue;
      }
      if(res.stop_reason==='pause_turn'){setStatus('يكمل البحث');continue}
      break;
    }
    curMsg.t=finalText||'تم.';
    curMsg.cites=[...cites.values()].slice(0,10);
    curMsg.usage=`${searches?searches+' بحث في الويب · ':''}${(usageIn+usageOut)>=1000?Math.round((usageIn+usageOut)/1000)+' ألف رمز':(usageIn+usageOut)+' رمز'}`;
    if(opts.scan){const s=settings();await put({...s,kind:'settings',id:'settings',lastScan:T},true)}
  }catch(e){curMsg.t=apiErrorText(e)}

}

function parseCSV(text){const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
    else if(ch==='"')q=true;else if(ch===','){row.push(f);f=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=ch}
  if(f||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>x.trim()))}

   case 'editContact':editContact(id);break;
   case 'ctype':{$('#cType').value=el.dataset.v;el.parentNode.querySelectorAll('.pill').forEach(b=>b.setAttribute('aria-pressed',b===el));$('#lName').textContent=el.dataset.v==='org'?'القسم':'الاسم';break}
   case 'saveContact':{const c=readContact();if(!c.name&&!c.org){toast('اكتب اسمًا أو جهة');return}document.activeElement&&document.activeElement.blur();await put(c);openContact(c.id);toast('حُفظ');break}
   case 'askDel':el.outerHTML=`<div class="grid2"><button class="btn red" data-act="doDel" data-id="${esc(id)}">نعم، احذف</button><button class="btn" data-act="close">تراجع</button></div>`;break;
   case 'doDel':closeSheet();await del(id);toast('حُذف');break;
   case 'addLog':{const c=byId(id);const s=$('#logS').value.trim();if(!s){$('#logS').focus();return}$('#logS').blur();await put({...c,log:[...(c.log||[]),{d:T,t:$('#logT').value,s}].slice(-200),last:T});toast('سُجّل');break}
   case 'setNext':{const c=byId(id);const v=$('#nextD').value;$('#nextD').blur();await put({...c,next:v});toast(v?'حُفظ الموعد':'أُلغيت المتابعة');break}
   case 'vcard':{const c=byId(id);shareFile((displayName(c)||'contact').replace(/[\\/:*?"<>|]/g,'')+'.vcf',vcard(c),'text/vcard');break}
   case 'ics':{const c=byId(id);if(!c.next)return;shareFile('follow-up.ics',ics('متابعة: '+displayName(c),c.next,[c.email,c.phone,c.notes].filter(Boolean).join('\n')),'text/calendar');break}
   case 'icsOpp':{const o=byId(id);shareFile('deadline.ics',ics('آخر موعد: '+o.title,o.deadline,[o.org,o.link,o.email].filter(Boolean).join('\n')),'text/calendar');break}
   case 'newOpp':editOpp(null,el.dataset.cid);break;
   case 'openOpp':openOpp(id);break;
   case 'editOpp':editOpp(id);break;
   case 'setStage':{const o=byId(id);if(o.ex){toast('هذا مثال توضيحي');return}await put({...o,stage:el.dataset.s});toast('نُقلت إلى «'+STAGE[el.dataset.s]+'»');break}
   case 'saveOpp':{const v=k=>$('#'+k).value.trim();const r=v('oRemote');const o={...editOpp.base,title:v('oTitle'),otype:v('oType'),org:v('oOrg'),location:v('oLoc'),stage:v('oStage'),deadline:v('oDeadline'),contactId:v('oContact'),email:v('oEmail'),link:v('oLink'),notes:$('#oNotes').value};
     if(r==='')delete o.remote;else o.remote=r==='1';
     if(!o.title){toast('اكتب عنوان الفرصة');return}document.activeElement&&document.activeElement.blur();await put(o);openOpp(o.id);toast('حُفظت');break}
   case 'composeOpp':{const o=byId(id);const c=byId(o.contactId);openCompose(c&&c.email?[c.id]:[],{oppId:o.id,tplId:['idea','contacted'].includes(o.stage)?'t-apply-ar':'t-follow',to:o.email});break}
   case 'compose':openCompose([id]);break;
   case 'bulk':{let cs=contacts();if(S.cat!=='all')cs=cs.filter(c=>c.cat===S.cat);cs=filterContacts(cs,S.q);openCompose(cs.map(c=>c.id));break}
   case 'copyMsg':{const c=C.ids.length?byId(C.ids[C.i]):null,o=C.oppId?byId(C.oppId):null;copy(fill(C.subject,c,o)+'\n\n'+fill(C.body,c,o));break}
   case 'logSent':{const c=byId(C.ids[C.i]),o=C.oppId?byId(C.oppId):null;const n=+$('#mFollow').value;
     if(!c.ex)await put({...c,last:T,next:n?addDays(T,n):(c.next||''),log:[...(c.log||[]),{d:T,t:'email',s:fill(C.subject,c,o)}].slice(-200)},true);
     if(o&&!o.ex&&['idea','contacted'].includes(o.stage))await put({...o,stage:C.tplId&&C.tplId.startsWith('t-apply')?'applied':'contacted'},true);
     if(C.i<C.ids.length-1){C.i++;drawCompose(true);toast('سُجّلت، التالي')}else{closeSheet();toast(c.ex?'هذا مثال توضيحي، لم يُسجَّل':'سُجّلت في سجل التواصل')}render();break}
   case 'skipNext':C.i++;drawCompose(true);break;
   case 'newSource':editSource(null);break;
   case 'openSource':editSource(id);break;
   case 'saveSource':{const v=k=>$('#'+k).value.trim();const s={...editSource.base,title:v('sTitle'),url:v('sUrl'),cat:v('sCat'),notes:$('#sNotes').value};if(!s.title&&!s.url){toast('اكتب اسمًا أو رابطًا');return}if(s.url&&!/^https?:/.test(s.url))s.url='https://'+s.url;await put(s);closeSheet();toast('حُفظ المصدر');break}
   case 'newTpl':editTpl(null);break;
   case 'editTpl':editTpl(id);break;
   case 'insPh':{const ta=$('#tBody');const p=ta.selectionStart??ta.value.length;ta.value=ta.value.slice(0,p)+el.dataset.v+ta.value.slice(ta.selectionEnd??p);ta.focus();ta.selectionStart=ta.selectionEnd=p+el.dataset.v.length;break}
   case 'saveTpl':await put({kind:'template',id,name:$('#tName').value.trim()||'قالب',lang:$('#tLang').value,subject:$('#tSubj').value,body:$('#tBody').value});closeSheet();toast('حُفظ القالب');break;
   case 'hideTpl':closeSheet();if(DEFAULT_TPLS.some(d=>d.id===id))await put({kind:'template',id,hidden:true});else await del(id);break;
   case 'editMe':editMe();break;
   case 'saveMe':{const v=k=>$('#'+k).value.trim();await put({...settings(),kind:'settings',id:'settings',myName:v('mName'),myRole:v('mRole'),myEmail:v('mEmail'),myPhone:v('mPhone'),myLinks:v('mLinks'),about:$('#mAbout').value.trim(),topics:$('#mTopics').value.trim(),followDays:+v('mFollow')});closeSheet();toast('حُفظ');break}
   case 'editAI':editAI();break;
   case 'saveAI':{setAiConf({key:$('#aKey').value.trim(),model:$('#aModel').value});closeSheet();render();toast('حُفظ');break}
   case 'clearAI':setAiConf({key:'',model:aiConf().model});closeSheet();render();toast('أُزيل المفتاح');break;
   case 'testAI':{const key=$('#aKey').value.trim(),model=$('#aModel').value;const out=$('#aiTest');if(!key){out.innerHTML='<p class="hint" style="margin:0">الصق المفتاح أولًا.</p>';return}
     setAiConf({key,model});out.innerHTML='<p class="hint" style="margin:0">جارٍ الاختبار…</p>';
     try{await callClaude({model,max_tokens:20,messages:[{role:'user',content:'قل: يعمل'}]});out.innerHTML='<div class="banner" style="background:var(--green-soft)"><b style="color:var(--green)">يعمل.</b> المساعد جاهز.</div>'}
     catch(err){out.innerHTML=`<div class="banner" style="background:var(--red-soft)">${esc(apiErrorText(err))}</div>`}break}
   case 'exportJson':shareFile('silat-backup-'+T+'.json',JSON.stringify([...S.items.values()].filter(x=>x.kind!=='chat'),null,1),'application/json');break;
   case 'exportCsv':{const cols=['name','org','role','cat','country','email','phone','links','tags','rel','last','next','notes'];const heads=['الاسم','الجهة','المنصب','التصنيف','البلد','البريد','الهاتف','روابط','وسوم','العلاقة','آخر تواصل','المتابعة','ملاحظات'];
     shareFile('silat-contacts-'+T+'.csv','\ufeff'+[heads.join(','),...all('contact').map(c=>cols.map(k=>csvCell(k==='cat'?CAT[c.cat]:k==='rel'?REL[c.rel]:c[k])).join(','))].join('\n'),'text/csv');break}
  }
});
$('#topAct').addEventListener('click',()=>{if(S.tab==='opps')editOpp(null);else editContact(null)});
$('#clipBtn').addEventListener('click',()=>$('#photo').click());
$('#sendBtn').addEventListener('click',()=>sendChat());
$('#chatIn').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&matchMedia('(pointer:fine)').matches){e.preventDefault();sendChat()}});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;render()}
  if(e.target.id==='chatIn'){autoGrow();updSend()}
  if(e.target.id==='mSubj'){C.subject=e.target.value;drawCompose(false)}
  if(e.target.id==='mBody'){C.body=e.target.value;drawCompose(false)}
  if(['mName','mRole','mEmail','mPhone','mLinks'].includes(e.target.id)){const v=k=>$('#'+k).value.trim();$('#sigPrev').textContent=signature({myName:v('mName'),myRole:v('mRole'),myEmail:v('mEmail'),myPhone:v('mPhone'),myLinks:v('mLinks')})}
});
document.addEventListener('change',async e=>{
  if(e.target.id==='mTpl'){const t=templates().find(x=>x.id===e.target.value);C.tplId=e.target.value;if(t){C.subject=t.subject;C.body=t.body}drawCompose(true)}
  if(e.target.id==='mOpp'){C.oppId=e.target.value;drawCompose(false)}
  if(e.target.id==='photo'){const files=[...e.target.files].slice(0,4);e.target.value='';const ok=[];
    for(const f of files){try{ok.push(await toJpegB64(f))}catch{}}
    pendingImgs=ok;const th=$('#thumbs');th.hidden=!ok.length;th.innerHTML=ok.map(b=>`<img alt="" src="data:image/jpeg;base64,${b}">`).join('');
    if(ok.length&&!$('#chatIn').value)$('#chatIn').value='استخرج كل المعلومات المفيدة من الصورة واحفظها';autoGrow();updSend()}
  if(e.target.id==='imp'){const f=e.target.files[0];if(!f)return;const text=await f.text();e.target.value='';
    try{let items;if(/\.json$/i.test(f.name)||text.trim().startsWith('[')){items=JSON.parse(text).filter(x=>x&&x.id&&x.kind&&x.kind!=='chat')}else{const rows=parseCSV(text.replace(/^\ufeff/,''));if(rows.length<2)throw 0;items=importRows(rows)}
      if(!items.length){toast('لم أجد بيانات في الملف');return}toast('جارٍ الاستيراد…');for(const it of items)await put(it,true);render();toast(`استُورد ${items.length} عنصر`)}
    catch{toast('تعذّرت قراءة الملف. استعمل CSV بسطر عناوين أو نسخة JSON')}}
});

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
render();initStore();
</script>
</body>
</html>
